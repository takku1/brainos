[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainos"
version = "0.1.0"
description = "Single-authority computational execution and recovery"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
brainos = "brainos.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
